# harness 法剖面配置（test_perf/harness.py）
#
# 约定：每阶段两个 bazel 目标
#     <package>:<target_prefix><phase>_profiling    复刻真实调用序列
#     <package>:<target_prefix><phase>_control      同样的前奏，不调用该阶段
# 阶段周期 = profiling − control（ISS 口径；文档 §1.2 的 C_net = C_prof - C_ctrl）
#
# 字段：
#   app_targets   可选；给了就做 macro profiling（文档 §4）+ 闭环核对（§5.13 等）
#   closure_ops   可选；只对这些操作做闭环核对（其余因"复用已测 kernel"不闭合）
#   phases 每项： name（必填）/ fips（FIPS 锚点）/ evidence（口径标签，文档 §1.3）
#                / closure（该阶段是否参与 Σ 闭环，子分解与 calibration 设 false）
#   phases 列表本身必填；**写 `[]` 合法** = apps-only 条目（没有 prof/control 桩的 app，
#                如末尾的 P-256 专表）：只出 ① Macro + 逐符号 exec_insn（JSON）+ 容器归因 +
#                体积；不做 Σ 闭环（那是给有阶段行的 ML-KEM 条目的）。
#
# 口径标签：Direct / Exact-real-input / Calibration
#   （2026-09-20 起：**所有行都是现场实测**，不再有 Reuse-fixed/Reuse-identical/Estimated 行；
#    旧标签仅保留在备份文档 v2-2026-09-18.bak.md 里作为历史口径）

versions:
  # ── ver0_1（纯软 Keccak + 自写 P-256）：harness 原始版本，先跑这个作为对照 ──
  # 参考数据：md文档/新方案/ver0_1数据/ML-KEM  Profiling.md
  - name: ver0_1
    label: "ver0_1（纯软 Keccak）"
    package: "//test_hybrid_kem_otbn_prompt_ver0_1/otbn/mlkem768"
    target_prefix: "mlkem768_"
    # macro（整 app）：**只做能实测的**，装不下的直接跳过、不用任何代填值。
    # 背景：ver0_1 是在 IMEM 32 KB / DMEM 127 KB 的扩展布局下构建的
    # （temp-cef4055）；master 官方 16+16 下 decap/encap 的 .text 超 IMEM。
    app_targets:
      keygen: "//test_hybrid_kem_otbn_prompt_ver0_1/otbn/mlkem768:mlkem768_keypair"
      encap:  "//test_hybrid_kem_otbn_prompt_ver0_1/otbn/mlkem768:mlkem768_encap"
      decap:  "//test_hybrid_kem_otbn_prompt_ver0_1/otbn/mlkem768:mlkem768_decap"
    # closure_ops：reuse 段补齐后 keygen/encap/decap 三个都能闭环 → 不限制
    # 函数调用闭环（文档 §5.13 的 "Keccak-f 调用闭环"）：统计 keccakf 的调用次数
    call_closure: {func: "keccakf", label: "Keccak-f"}
    phases:
      # ── KeyGen（13）—— 文档 §5.13 ──
      - {name: keygen_poly_gen_matrix,             fips: "Alg.13 L3–7 / Alg.7",   evidence: Exact-real-input}
      - {name: keygen_hash_h,                      fips: "Alg.16 L3",             evidence: Direct}
      - {name: keygen_poly_getnoise_eta_1,         fips: "Alg.13 L8–15",          evidence: Direct}
      - {name: keygen_ntt,                         fips: "Alg.13 L16–17",         evidence: Direct}
      - {name: keygen_basemul_basemul_acc,         fips: "Alg.13 L18",            evidence: Direct}
      - {name: keygen_poly_reduce,                 fips: "Alg.13 L18 support",    evidence: Direct}
      - {name: keygen_poly_add,                    fips: "Alg.13 L18",            evidence: Direct}
      - {name: keygen_pack_pk,                     fips: "Alg.13 L19",            evidence: Direct}
      - {name: keygen_pack_sk,                     fips: "Alg.13 L20",            evidence: Direct}
      - {name: keygen_sha3_init_update_final,      fips: "Alg.13 L1 / G(d‖k)",    evidence: Direct}
      # poly_gen_matrix 的三项子分解（不参与 Σ 闭环）
      # ⚠ 桩法两行待重标定（2026-09-20 静态复核）：流文件还是**旧 ρ 时代**那份（数据与当前 app
      #   的轨迹不符），且 _stub_overhead 的 replay 写死 137 而 app 实测已变 **135**（挤压次数
      #   随 ρ 变化：按需补挤）⇒ `shake + rejection − stub_overhead` 的合成值有偏，勿直接进表。
      #   复核工具：test_perf/tools/check/check_stream_shape.py（不变量 B）
      - {name: keygen_poly_gen_matrix_shake,       fips: "Alg.7 子分解 / XOF 路径", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_rejection,   fips: "Alg.7 子分解 / 拒绝采样", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_stub_overhead, fips: "校准（非 FIPS 步骤）", evidence: Calibration, closure: false}
      # ── Encaps（6）—— 文档 §6.11 ──
      - {name: encap_poly_gen_matrix,              fips: "Alg.14 L4–8 / Alg.7",   evidence: Exact-real-input}
      # encap_intt harness 只调 1 次 INTT（8,773）；文档的 "INTT ×4 = 35,092" 是乘以
      # 算法调用次数 → 本行不进 Σ，由 reuse 段的 encap_intt_x4（35,092）进 Σ。
      - {name: encap_intt,                         fips: "Alg.14 L19,L21",        evidence: "Direct (单次)", closure: false}
      - {name: encap_pack_ciphertext,              fips: "Alg.14 L22–24",         evidence: Direct}
      - {name: encap_unpack_pk,                    fips: "Alg.14 L2–3",           evidence: Direct}
      - {name: encap_poly_frommsg,                 fips: "Alg.14 L20",            evidence: Direct}
      - {name: encap_hash_g,                       fips: "Alg.17 L2 / G(m‖H(ek))", evidence: Direct}
      # ── Decaps（6）—— 文档 §7.11 ──
      - {name: decap_poly_gen_matrix,              fips: "Alg.18 L8→Alg.14 L4–8", evidence: Exact-real-input}
      - {name: decap_unpack_ciphertext,            fips: "Alg.15 L1–4",           evidence: Direct}
      - {name: decap_poly_sub,                     fips: "Alg.15 L6",             evidence: Direct}
      - {name: decap_poly_tomsg,                   fips: "Alg.15 L7",             evidence: Direct}
      - {name: decap_shake_z_ct,                   fips: "Alg.18 L9 / J(z‖c)",    evidence: Direct}
      - {name: decap_verify_cmov,                  fips: "Alg.18 L9–10",          evidence: Direct}
      # ── 实测行（2026-09-20）：原 reuse 估算行改为在本 op 现场实测，行名不变 ──
      - {name: encap_poly_reduce_x4,      fips: "Alg.14 L19,L21 support",     evidence: Direct}
      - {name: decap_poly_reduce_x5,      fips: "arithmetic support",         evidence: Direct}
      - {name: encap_intt_x4,            fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_noise_x7,           fips: "Alg.14 L9–17",                evidence: Direct}
      - {name: encap_h_ek,               fips: "Alg.17 L1 subexpr.",          evidence: Direct}
      - {name: encap_basemul_acc_x12,    fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_ntt_x3,             fips: "Alg.14 L18",                  evidence: Direct}
      - {name: encap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_noise_x7,           fips: "Alg.18 L8→Alg.14 L9–17",      evidence: Direct}
      - {name: decap_basemul_acc_x15,    fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_ntt_x6,             fips: "Alg.15 L6 + Alg.14 L18",      evidence: Direct}
      - {name: decap_intt_x5,            fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_pack_ciphertext,    fips: "Alg.18 L8→Alg.14 L22–24",     evidence: Direct}
      - {name: decap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_hash_g_reuse,       fips: "Alg.18 L8 → G(m'‖h)",         evidence: Direct}
      - {name: decap_unpack_sk_pk,       fips: "Alg.15 L5 + Alg.14 L2–3",     evidence: Direct}
      - {name: decap_poly_frommsg_reuse, fips: "Alg.18 L8→Alg.14 L20",        evidence: Direct}
    # 复用行：已全部移除（2026-09-20）—— 原 17 条 Reuse-fixed/Estimated/
    # Reuse-identical 行改成本 op 的现场实测行（行名不变）。
    reuse: []
  - name: ver0_2
    label: "ver0_2（KMAC 硬件哈希）"
    package: "//test_hybrid_kem_otbn_prompt_ver0_2/otbn/mlkem768"
    target_prefix: "mlkem768_"
    app_targets:
      keygen: "//test_hybrid_kem_otbn_prompt_ver0_2/otbn/mlkem768:mlkem768_keypair"
      encap:  "//test_hybrid_kem_otbn_prompt_ver0_2/otbn/mlkem768:mlkem768_encap"
      decap:  "//test_hybrid_kem_otbn_prompt_ver0_2/otbn/mlkem768:mlkem768_decap"
    # KMAC 驱动调用闭环（对应 ver0_1 的 Keccak-f 闭环）：统计整套 xof API 的调用次数
    call_closure:
      funcs: ["xof_sha3_256_init", "xof_sha3_512_init", "xof_shake128_init", "xof_shake256_init",
              "xof_absorb", "xof_process", "xof_squeeze32", "xof_finish"]
      label: "KMAC 驱动 API"
    phases:
      # ── 算术类 14 ──
      - {name: keygen_ntt,                 fips: "Alg.13 L16–17",   evidence: Direct}
      - {name: keygen_basemul_basemul_acc, fips: "Alg.13 L18",       evidence: Direct}
      - {name: keygen_poly_reduce,         fips: "Alg.13 L18 support", evidence: Direct}
      - {name: keygen_poly_add,            fips: "Alg.13 L18",       evidence: Direct}
      - {name: keygen_pack_pk,             fips: "Alg.13 L19",       evidence: Direct}
      - {name: keygen_pack_sk,             fips: "Alg.13 L20",       evidence: Direct}
      # ── hash 类（KMAC 路径）8 ──
      - {name: keygen_hash_h,              fips: "Alg.16 L3",        evidence: Direct}
      - {name: keygen_sha3_init_update_final, fips: "Alg.13 L1 / G(d‖k)", evidence: Direct}
      - {name: keygen_poly_getnoise_eta_1, fips: "Alg.13 L8–15",     evidence: Direct}
      - {name: keygen_poly_gen_matrix,     fips: "Alg.13 L3–7 / Alg.7", evidence: Exact-real-input}
      - {name: encap_hash_g,               fips: "Alg.17 L2 / G(m‖H(ek))", evidence: Direct}
      - {name: encap_poly_gen_matrix,      fips: "Alg.14 L4–8 / Alg.7", evidence: Exact-real-input}
      - {name: decap_poly_gen_matrix,      fips: "Alg.18 L8→Alg.14 L4–8", evidence: Exact-real-input}
      - {name: decap_shake_z_ct,           fips: "Alg.18 L9 / J(z‖c)", evidence: Direct}
      # 注：encap_intt harness 只调 1 次 INTT（8,773）；文档的 "INTT ×4 = 35,092"
      # 是乘以算法调用次数 → 直接行不进 Σ，由 reuse 段的 encap_intt_x4 进 Σ。
      - {name: encap_intt,                 fips: "Alg.14 L19,L21",   evidence: "Direct (单次)", closure: false}
      - {name: encap_pack_ciphertext,      fips: "Alg.14 L22–24",    evidence: Direct}
      - {name: encap_unpack_pk,            fips: "Alg.14 L2–3",      evidence: Direct}
      - {name: encap_poly_frommsg,         fips: "Alg.14 L20",       evidence: Direct}
      - {name: decap_unpack_ciphertext,    fips: "Alg.15 L1–4",      evidence: Direct}
      - {name: decap_poly_sub,             fips: "Alg.15 L6",        evidence: Direct}
      - {name: decap_poly_tomsg,           fips: "Alg.15 L7",        evidence: Direct}
      - {name: decap_verify_cmov,          fips: "Alg.18 L9–10",     evidence: Direct}
      # poly_gen_matrix 的三项子分解（桩法；不参与 Σ 闭环）
      # ⚠ 桩法两行待重标定（2026-09-20 静态复核）：流文件仍是**旧 ρ 时代**那份（与当前 app 的
      #   轨迹不符），且 _stub_overhead 的 replay 写死 137 而 app 实测已变 **135**（挤压次数随 ρ
      #   变化：按需补挤）⇒ `shake + rejection − stub_overhead` 的合成值有偏，勿直接进表。
      #   复核工具：test_perf/tools/check/check_stream_shape.py（不变量 B）
      - {name: keygen_poly_gen_matrix_shake,         fips: "Alg.7 子分解 / XOF 路径", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_rejection,     fips: "Alg.7 子分解 / 拒绝采样", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_stub_overhead, fips: "校准（非 FIPS 步骤）", evidence: Calibration, closure: false}
      - {name: encap_poly_reduce_x4,      fips: "Alg.14 L19,L21 support",     evidence: Direct}
      - {name: decap_poly_reduce_x5,      fips: "arithmetic support",         evidence: Direct}
      # ── 实测行（2026-09-20）：原 reuse 估算行改为在本 op 现场实测，行名不变 ──
      - {name: encap_intt_x4,            fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_noise_x7,           fips: "Alg.14 L9–17",                evidence: Direct}
      - {name: encap_h_ek,               fips: "Alg.17 L1 subexpr.",          evidence: Direct}
      - {name: encap_basemul_acc_x12,    fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_ntt_x3,             fips: "Alg.14 L18",                  evidence: Direct}
      - {name: encap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_noise_x7,           fips: "Alg.18 L8→Alg.14 L9–17",      evidence: Direct}
      - {name: decap_basemul_acc_x15,    fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_ntt_x6,             fips: "Alg.15 L6 + Alg.14 L18",      evidence: Direct}
      - {name: decap_intt_x5,            fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_pack_ciphertext,    fips: "Alg.18 L8→Alg.14 L22–24",     evidence: Direct}
      - {name: decap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_hash_g_reuse,       fips: "Alg.18 L8 → G(m'‖h)",         evidence: Direct}
      - {name: decap_unpack_sk_pk,       fips: "Alg.15 L5 + Alg.14 L2–3",     evidence: Direct}
      - {name: decap_poly_frommsg_reuse, fips: "Alg.18 L8→Alg.14 L20",        evidence: Direct}
    # 复用行：已全部移除（2026-09-20）—— 原 15 条 Reuse-fixed/
    # Estimated/Reuse-identical 行改成本 op 的现场实测行（行名不变）。
    reuse: []
  - name: ver1_1
    label: "ver1_1（官方向量指令 + KMAC 硬件哈希）"
    package: "//test_hybrid_kem_otbn_prompt_ver1_1/otbn/mlkem768"
    target_prefix: "mlkem768_"
    # 2026-09-20：全部剖面目标按 ver1_1 内核的调用约定重写（原为 ver0_2 逐字拷贝）。
    # 与 ver0_1/ver0_2 的阶段表差异（ver1_1 的结构变化）：
    #   · keygen_poly_reduce        —— 删除：ver1_1 把归约融进 basemul_acc，无独立内核
    #   · keygen_poly_gen_matrix_shake / _rejection / _stub_overhead —— **已接线（2026-09-20）**：
    #     按 ver1_1 的 χOF 约定重放（每会话 `loopi 21,3` ⇒ 21 块/会话 × 9 = **189 块**；app 实测
    #     `xof_squeeze32 ×189` ✓，行里的 `.rept 21`×9 也是 189 ✓）。**前提：流文件必须是 189 块**。
    #     包内那份是从 ver0_x 原样拷来的 **180 块（20 块/会话）**（ver0_x 是按需挤压、每会话配额
    #     640 B = 20 块）⇒ ① `_stub_overhead` 指针设一次后线性走 189 块，末尾 9 块越出已加载镜像、
    #     落进 NOLOAD 的 `.scratchpad` ⇒ 桩里 `bn.lid` 报 `DMEM_INTG_VIOLATION (0x20000)`、**Δ 残缺**；
    #     ② `_rejection` 按会话重指指针、每会话消费 21 块 > 配额 20 ⇒ 每会话多读 1 块（邻会话数据），
    #     只有末会话越出载荷 32 B 且落在已加载 `.data` 尾部 ⇒ **不报错、静默错轨迹**（更危险）。
    #     判定/复核：`test_perf/tools/check/check_stream_shape.py`；修复：`test_perf/tools/gen/dump_xof_stream.py` 重抓 189 块。
    #     两者都是 closure:false 的校准行，不影响 Σ。
    #   · keygen_poly_add           —— **已删除（2026-09-20）**：ver1_1 的 keygen 把 e 的
    #     加法融进 basemul_acc 的累加器 ⇒ app **从不调用** poly_add（ISS 实测 exec_insn=0、
    #     动态调用 0 次 = 死代码）。原先保留的"同名行"声明 3 次调用并进 Σ ⇒ **凭空多算 750 拍**
    #     （虚增 Σ、压低残差）。判定方式见 `test_perf/tools/check/audit_fidelity.py` 的"幽灵行"检查。
    #   · encap_pack_ciphertext / decap_unpack_ciphertext —— 阶段名保留，序列换成
    #     ver1_1 的等价内核（compress_10×3 + compress_4 / decompress_10×3 + decompress_4）
    app_targets:
      keygen: "//test_hybrid_kem_otbn_prompt_ver1_1/otbn/mlkem768:mlkem768_keypair"
      encap:  "//test_hybrid_kem_otbn_prompt_ver1_1/otbn/mlkem768:mlkem768_encap"
      decap:  "//test_hybrid_kem_otbn_prompt_ver1_1/otbn/mlkem768:mlkem768_decap"
    # KMAC 驱动调用闭环（对应 ver0_1 的 Keccak-f 闭环）：统计整套 xof API 的调用次数
    call_closure:
      funcs: ["xof_sha3_256_init", "xof_sha3_512_init", "xof_shake128_init", "xof_shake256_init",
              "xof_absorb", "xof_process", "xof_squeeze32", "xof_finish"]
      label: "KMAC 驱动 API"
    phases:
      # ── 算术类 14 ──
      - {name: keygen_ntt,                 fips: "Alg.13 L16–17",   evidence: Direct}
      - {name: keygen_basemul_basemul_acc, fips: "Alg.13 L18",       evidence: Direct}
      - {name: keygen_pack_pk,             fips: "Alg.13 L19",       evidence: Direct}
      - {name: keygen_pack_sk,             fips: "Alg.13 L20",       evidence: Direct}
      # ── hash 类（KMAC 路径）8 ──
      - {name: keygen_hash_h,              fips: "Alg.16 L3",        evidence: Direct}
      - {name: keygen_sha3_init_update_final, fips: "Alg.13 L1 / G(d‖k)", evidence: Direct}
      - {name: keygen_poly_getnoise_eta_1, fips: "Alg.13 L8–15",     evidence: Direct}
      - {name: keygen_poly_gen_matrix,     fips: "Alg.13 L3–7 / Alg.7", evidence: Exact-real-input}
      - {name: encap_hash_g,               fips: "Alg.17 L2 / G(m‖H(ek))", evidence: Direct}
      - {name: encap_poly_gen_matrix,      fips: "Alg.14 L4–8 / Alg.7", evidence: Exact-real-input}
      - {name: decap_poly_gen_matrix,      fips: "Alg.18 L8→Alg.14 L4–8", evidence: Exact-real-input}
      - {name: decap_shake_z_ct,           fips: "Alg.18 L9 / J(z‖c)", evidence: Direct}
      # 注：encap_intt harness 只调 1 次 INTT（8,773）；文档的 "INTT ×4 = 35,092"
      # 是乘以算法调用次数 → 直接行不进 Σ，由 reuse 段的 encap_intt_x4 进 Σ。
      - {name: encap_intt,                 fips: "Alg.14 L19,L21",   evidence: "Direct (单次)", closure: false}
      - {name: encap_pack_ciphertext,      fips: "Alg.14 L22–24",    evidence: Direct}
      - {name: encap_unpack_pk,            fips: "Alg.14 L2–3",      evidence: Direct}
      - {name: encap_poly_frommsg,         fips: "Alg.14 L20",       evidence: Direct}
      - {name: decap_unpack_ciphertext,    fips: "Alg.15 L1–4",      evidence: Direct}
      - {name: decap_poly_sub,             fips: "Alg.15 L6",        evidence: Direct}
      - {name: decap_poly_tomsg,           fips: "Alg.15 L7",        evidence: Direct}
      - {name: decap_verify_cmov,          fips: "Alg.18 L9–10",     evidence: Direct}
      # ── 实测行（2026-09-20）：原 reuse 估算行改为在各自 op 现场实测，行名不变 ──
      # 次数 = 该 app 源码的动态调用次数；口径一律 Direct（不再是 Reuse/Estimated）
      - {name: encap_intt_x4,            fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_noise_x7,           fips: "Alg.14 L9–17",                evidence: Direct}
      - {name: encap_h_ek,               fips: "Alg.17 L1 subexpr.",          evidence: Direct}
      - {name: encap_basemul_acc_x12,    fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_ntt_x3,             fips: "Alg.14 L18",                  evidence: Direct}
      - {name: encap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_noise_x7,           fips: "Alg.18 L8→Alg.14 L9–17",      evidence: Direct}
      - {name: decap_basemul_acc_x15,    fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_ntt_x6,             fips: "Alg.15 L6 + Alg.14 L18",      evidence: Direct}
      - {name: decap_intt_x5,            fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_pack_ciphertext,    fips: "Alg.18 L8→Alg.14 L22–24",     evidence: Direct}
      - {name: decap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_hash_g_reuse,       fips: "Alg.18 L8 → G(m'‖h)",         evidence: Direct}
      - {name: decap_unpack_sk_pk,       fips: "Alg.15 L5 + Alg.14 L2–3",     evidence: Direct}
      - {name: decap_poly_frommsg_reuse, fips: "Alg.18 L8→Alg.14 L20",        evidence: Direct}
      # poly_gen_matrix 的子分解：ver1_1 三行都已接线（2026-09-20）
      # ⚠ 前提是流文件 = **189 块**（21 块/会话）；若还是 ver0_x 形状的 180 块，则 _stub_overhead
      #   越界崩溃（DMEM_INTG_VIOLATION）、_rejection 静默读邻会话数据 —— 见上方说明，
      #   复核用 test_perf/tools/check/check_stream_shape.py
      - {name: keygen_poly_gen_matrix_shake,         fips: "Alg.7 子分解 / XOF 路径", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_rejection,     fips: "Alg.7 子分解 / 拒绝采样", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_stub_overhead, fips: "校准（非 FIPS 步骤）", evidence: Calibration, closure: false}
    # 复用行：已全部移除（2026-09-20）—— 原 15 条 Reuse-fixed/Estimated/
    # Reuse-identical 行都改成上面 phases 里的现场实测行，行名保持不变。
    reuse: []

  # ── ver1_2 = ver1_1 内核 + P-256 折叠指令（由 ver1_1 条目派生，工具见 run_dir）──
  # ML-KEM/HKDF 内核与全部剖面目标与 ver1_1 **逐字节相同**（版本树是基线副本），因此阶段表、
  # 调用闭环、口径标签一律沿用；只有 package/app_targets 指向 ver1_2。
  # 本版真正新增的是 **P-256**（域乘 = 一条 bn.p256mul）：它不进这条 ML-KEM 条目的阶段表，
  # 而在文件末尾**单独的 apps-only 条目** `p256_ver1_2` + `p256_official`（P-256 专表）里测。
  # 设备路径证据见 p5_device_evidence.ver1_2.txt。
  - name: ver1_2
    label: "ver1_2（ver1_1 内核 + P-256 折叠指令）"
    package: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/mlkem768"
    target_prefix: "mlkem768_"
    # 2026-09-20：全部剖面目标按 ver1_1 内核的调用约定重写（原为 ver0_2 逐字拷贝）。
    # 与 ver0_1/ver0_2 的阶段表差异（ver1_1 的结构变化）：
    #   · keygen_poly_reduce        —— 删除：ver1_1 把归约融进 basemul_acc，无独立内核
    #   · keygen_poly_gen_matrix_shake / _rejection / _stub_overhead —— **已接线（2026-09-20）**：
    #     按 ver1_1 的 χOF 约定重放（每会话 `loopi 21,3` ⇒ 21 块/会话 × 9 = **189 块**；app 实测
    #     `xof_squeeze32 ×189` ✓，行里的 `.rept 21`×9 也是 189 ✓）。**前提：流文件必须是 189 块**。
    #     包内那份是从 ver0_x 原样拷来的 **180 块（20 块/会话）**（ver0_x 是按需挤压、每会话配额
    #     640 B = 20 块）⇒ ① `_stub_overhead` 指针设一次后线性走 189 块，末尾 9 块越出已加载镜像、
    #     落进 NOLOAD 的 `.scratchpad` ⇒ 桩里 `bn.lid` 报 `DMEM_INTG_VIOLATION (0x20000)`、**Δ 残缺**；
    #     ② `_rejection` 按会话重指指针、每会话消费 21 块 > 配额 20 ⇒ 每会话多读 1 块（邻会话数据），
    #     只有末会话越出载荷 32 B 且落在已加载 `.data` 尾部 ⇒ **不报错、静默错轨迹**（更危险）。
    #     判定/复核：`test_perf/tools/check/check_stream_shape.py`；修复：`test_perf/tools/gen/dump_xof_stream.py` 重抓 189 块。
    #     两者都是 closure:false 的校准行，不影响 Σ。
    #   · keygen_poly_add           —— **已删除（2026-09-20）**：ver1_1 的 keygen 把 e 的
    #     加法融进 basemul_acc 的累加器 ⇒ app **从不调用** poly_add（ISS 实测 exec_insn=0、
    #     动态调用 0 次 = 死代码）。原先保留的"同名行"声明 3 次调用并进 Σ ⇒ **凭空多算 750 拍**
    #     （虚增 Σ、压低残差）。判定方式见 `test_perf/tools/check/audit_fidelity.py` 的"幽灵行"检查。
    #   · encap_pack_ciphertext / decap_unpack_ciphertext —— 阶段名保留，序列换成
    #     ver1_1 的等价内核（compress_10×3 + compress_4 / decompress_10×3 + decompress_4）
    app_targets:
      keygen: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/mlkem768:mlkem768_keypair"
      encap:  "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/mlkem768:mlkem768_encap"
      decap:  "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/mlkem768:mlkem768_decap"
    # KMAC 驱动调用闭环（对应 ver0_1 的 Keccak-f 闭环）：统计整套 xof API 的调用次数
    call_closure:
      funcs: ["xof_sha3_256_init", "xof_sha3_512_init", "xof_shake128_init", "xof_shake256_init",
              "xof_absorb", "xof_process", "xof_squeeze32", "xof_finish"]
      label: "KMAC 驱动 API"
    phases:
      # ── 算术类 14 ──
      - {name: keygen_ntt,                 fips: "Alg.13 L16–17",   evidence: Direct}
      - {name: keygen_basemul_basemul_acc, fips: "Alg.13 L18",       evidence: Direct}
      - {name: keygen_pack_pk,             fips: "Alg.13 L19",       evidence: Direct}
      - {name: keygen_pack_sk,             fips: "Alg.13 L20",       evidence: Direct}
      # ── hash 类（KMAC 路径）8 ──
      - {name: keygen_hash_h,              fips: "Alg.16 L3",        evidence: Direct}
      - {name: keygen_sha3_init_update_final, fips: "Alg.13 L1 / G(d‖k)", evidence: Direct}
      - {name: keygen_poly_getnoise_eta_1, fips: "Alg.13 L8–15",     evidence: Direct}
      - {name: keygen_poly_gen_matrix,     fips: "Alg.13 L3–7 / Alg.7", evidence: Exact-real-input}
      - {name: encap_hash_g,               fips: "Alg.17 L2 / G(m‖H(ek))", evidence: Direct}
      - {name: encap_poly_gen_matrix,      fips: "Alg.14 L4–8 / Alg.7", evidence: Exact-real-input}
      - {name: decap_poly_gen_matrix,      fips: "Alg.18 L8→Alg.14 L4–8", evidence: Exact-real-input}
      - {name: decap_shake_z_ct,           fips: "Alg.18 L9 / J(z‖c)", evidence: Direct}
      # 注：encap_intt harness 只调 1 次 INTT（8,773）；文档的 "INTT ×4 = 35,092"
      # 是乘以算法调用次数 → 直接行不进 Σ，由 reuse 段的 encap_intt_x4 进 Σ。
      - {name: encap_intt,                 fips: "Alg.14 L19,L21",   evidence: "Direct (单次)", closure: false}
      - {name: encap_pack_ciphertext,      fips: "Alg.14 L22–24",    evidence: Direct}
      - {name: encap_unpack_pk,            fips: "Alg.14 L2–3",      evidence: Direct}
      - {name: encap_poly_frommsg,         fips: "Alg.14 L20",       evidence: Direct}
      - {name: decap_unpack_ciphertext,    fips: "Alg.15 L1–4",      evidence: Direct}
      - {name: decap_poly_sub,             fips: "Alg.15 L6",        evidence: Direct}
      - {name: decap_poly_tomsg,           fips: "Alg.15 L7",        evidence: Direct}
      - {name: decap_verify_cmov,          fips: "Alg.18 L9–10",     evidence: Direct}
      # ── 实测行（2026-09-20）：原 reuse 估算行改为在各自 op 现场实测，行名不变 ──
      # 次数 = 该 app 源码的动态调用次数；口径一律 Direct（不再是 Reuse/Estimated）
      - {name: encap_intt_x4,            fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_noise_x7,           fips: "Alg.14 L9–17",                evidence: Direct}
      - {name: encap_h_ek,               fips: "Alg.17 L1 subexpr.",          evidence: Direct}
      - {name: encap_basemul_acc_x12,    fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: encap_ntt_x3,             fips: "Alg.14 L18",                  evidence: Direct}
      - {name: encap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_noise_x7,           fips: "Alg.18 L8→Alg.14 L9–17",      evidence: Direct}
      - {name: decap_basemul_acc_x15,    fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_ntt_x6,             fips: "Alg.15 L6 + Alg.14 L18",      evidence: Direct}
      - {name: decap_intt_x5,            fips: "Alg.15 L6 + Alg.14 L19,L21",  evidence: Direct}
      - {name: decap_pack_ciphertext,    fips: "Alg.18 L8→Alg.14 L22–24",     evidence: Direct}
      - {name: decap_poly_add_x5,        fips: "Alg.14 L19,L21",              evidence: Direct}
      - {name: decap_hash_g_reuse,       fips: "Alg.18 L8 → G(m'‖h)",         evidence: Direct}
      - {name: decap_unpack_sk_pk,       fips: "Alg.15 L5 + Alg.14 L2–3",     evidence: Direct}
      - {name: decap_poly_frommsg_reuse, fips: "Alg.18 L8→Alg.14 L20",        evidence: Direct}
      # poly_gen_matrix 的子分解：ver1_1 三行都已接线（2026-09-20）
      # ⚠ 前提是流文件 = **189 块**（21 块/会话）；若还是 ver0_x 形状的 180 块，则 _stub_overhead
      #   越界崩溃（DMEM_INTG_VIOLATION）、_rejection 静默读邻会话数据 —— 见上方说明，
      #   复核用 test_perf/tools/check/check_stream_shape.py
      - {name: keygen_poly_gen_matrix_shake,         fips: "Alg.7 子分解 / XOF 路径", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_rejection,     fips: "Alg.7 子分解 / 拒绝采样", evidence: Direct, closure: false}
      - {name: keygen_poly_gen_matrix_stub_overhead, fips: "校准（非 FIPS 步骤）", evidence: Calibration, closure: false}
    # 复用行：已全部移除（2026-09-20）—— 原 15 条 Reuse-fixed/Estimated/
    # Reuse-identical 行都改成上面 phases 里的现场实测行，行名保持不变。
    reuse: []

  # ══ P-256 专表（2026-10-01 增补）══════════════════════════════════════════
  # 背景：本配置原本只覆盖 ML-KEM（P-256 的数只在设备路径证据里）。现在两侧都有可自包含运行的
  # **otbn_binary** 目标 ⇒ 按「每侧一个 apps-only 条目」进表。
  # （`bazel cquery --output=files` 只对 otbn_binary 给出 `.elf`，因此不用 sim test 目标。）
  #
  # 对照关系（本节用途）：`p256_official` 与 `p256_ver1_2` 的 `ecdh` 是**同一支测试程序**
  # （`p256_ecdh_shared_key_test.s`，两版逐字节相同 ✓），测试只 `jal p256_shared_key`；
  # 两侧 deps 逐项相同，只有 `p256_base.s` 不同 —— 其 `mul_modp` 函数体：
  #   官方 = 软件实现（53 条指令）；ver1_2 = 折叠 `bn.p256mul`（1 条）。
  # 官方侧的软件实现与 ver0_1 本地副本的执行路径**逐函数逐行相同**（2026-10-01 复核：ver0_1 的
  # p256_base.s 是上游的纯裁剪、18 个函数全同；p256_shared_key.s + p256_a2b.s 三个函数全同），
  # 且**设备口径的旧侧本来就是官方实现**（ver0_1→ver1_1 的 ibex 走官方接口）⇒ 两侧都取官方实现。
  # ⚠ **不用 ver0_1 的本地 `otbn/p256` 目标**（2026-10-01 定位到装配缺陷）：那些目标把 4 个 `.s`
  # 合在一次汇编，而 `p256_isoncurve_proj.s` 没有 `.text` 指示 ⇒ 代码被汇编进 `.data`
  # （其 ELF 的 data 段 684 B = 数据 480 + 代码 204）、符号落数据段、`jal` 跳飞 ⇒ 曲线自检
  # 拿垃圾值、故意触发 ILLEGAL_INSN（ERR_BITS=0x8）。官方库一文件一库、各自汇编，无此问题。
  # 设备口径同一对照：Keygen 573,922 → 84,679、ECDH 581,607 → 91,893（−85.3% / −84.2%，
  # 见 test_perf/doc_fragments/ver1_2_extra.md）；本表给 ISS 口径的同源对照
  # （含逐符号 exec_insn，在 JSON 里）。
  - name: p256_official
    label: "P-256 / 官方实现（sw/otbn/crypto；域乘 = 软件 mul_modp，53 条）"
    package: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256"
    app_targets:
      ecdh:     "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256:p256_ecdh_shared_key_official"
      mul_modp: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256:p256_mul_modp_official"
    phases: []
    reuse: []

  - name: p256_ver1_2
    label: "P-256 / ver1_2（折叠域乘 = 1 条 bn.p256mul）"
    package: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256"
    app_targets:
      ecdh:     "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256:p256_ecdh_shared_key"
      mul_modp: "//test_hybrid_kem_otbn_prompt_ver1_2/otbn/p256:p256_mul_modp"
    phases: []
    reuse: []
